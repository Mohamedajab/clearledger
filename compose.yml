name: clearledger

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HOSTNAME: http://localhost:3000/auth
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./infra/keycloak/clearledger-realm.json:/opt/keycloak/data/import/clearledger-realm.json:ro
    ports: ["127.0.0.1:8180:8080"]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clearledger}
      POSTGRES_USER: ${POSTGRES_USER:-clearledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clearledger}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:v25.2.5
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=768M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports: ["127.0.0.1:19092:19092", "127.0.0.1:9644:9644"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 8s
      timeout: 5s
      retries: 12

  console:
    profiles: ["tools"]
    image: redpandadata/console:v3.2.2
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports: ["127.0.0.1:8090:8080"]
    depends_on:
      redpanda: { condition: service_healthy }

  api:
    build:
      context: ./services/ledger-api
    environment:
      OIDC_ISSUER_URI: http://localhost:3000/auth/realms/clearledger
      OIDC_JWK_SET_URI: http://keycloak:8080/auth/realms/clearledger/protocol/openid-connect/certs
      OIDC_AUDIENCE: clearledger-api
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-clearledger}
      DATABASE_USER: ${POSTGRES_USER:-clearledger}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-clearledger}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      OUTBOX_PUBLISHER_ENABLED: "true"
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redpanda: { condition: service_healthy }
      keycloak: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 25s

  ui:
    build:
      context: ./apps/control-plane
      args:
        VITE_DEMO_MODE: "false"
    ports: ["127.0.0.1:3000:8080"]
    depends_on:
      api: { condition: service_healthy }

  prometheus:
    profiles: ["tools"]
    image: prom/prometheus:v3.5.0
    command: --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["127.0.0.1:9090:9090"]
    depends_on:
      api: { condition: service_healthy }

  grafana:
    profiles: ["tools"]
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [prometheus]

volumes:
  postgres-data:
  grafana-data:
