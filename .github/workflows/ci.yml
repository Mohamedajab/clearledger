name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ledger-api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify application and architecture
        run: ./mvnw --batch-mode verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-plane
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/control-plane/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Build production images
        run: docker compose build api ui
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/control-plane/package-lock.json
      - name: Start authenticated local fixture
        run: docker compose up -d --wait --wait-timeout 180 postgres redis redpanda keycloak api ui
      - name: Wait for identity provider
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3000/auth/realms/clearledger/.well-known/openid-configuration > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Verify browser payment and access workflows
        working-directory: apps/control-plane
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: apps/control-plane/test-results/
      - name: Fixture logs
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop fixture
        if: always()
        run: docker compose down
